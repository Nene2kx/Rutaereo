<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RutaAero — Fase 3</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""><style>body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#172033;margin:0}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:#fff;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 8px 28px #0001}input,select{width:100%;padding:12px;margin:5px 0 12px;border:1px solid #ccd5e3;border-radius:10px;box-sizing:border-box}button{border:0;border-radius:10px;padding:12px 15px;background:#1877f2;color:#fff;font-weight:700;cursor:pointer;margin:4px}.danger{background:#ffe8e8;color:#b42318}.route{border:1px solid #dde4ee;border-radius:12px;padding:14px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.muted{color:#667085}@media(max-width:600px){.grid{grid-template-columns:1fr}}#map{height:340px;border-radius:14px;margin:12px 0}.route-card{border:1px solid #dde4ee;border-radius:14px;padding:15px;margin:10px 0}.point{padding:7px 9px;background:#f4f7fb;border-radius:9px;margin:5px 0}.status{font-weight:800}.pending{color:#b54708}.accepted{color:#18864b}.rejected{color:#b42318}</style></head><body><div class="wrap"><h1>🚗 RutaAero</h1><p class="muted">Fase 2 · Node.js 24</p><div id="auth"></div><div id="app"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script><script>
let token=localStorage.getItem("ra_token")||"",user=null,map=null,routeMarker=null;const $=x=>document.getElementById(x);async function api(u,o={}){o.headers={...(o.headers||{}),"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{})};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||"Error");return d}function auth(){$("auth").innerHTML=token?`<div class="card"><b>Sesión iniciada</b><button class="danger" onclick="logout()">Cerrar sesión</button></div>`:`<div class="card grid"><div><h2>Crear cuenta</h2><input id="rn" placeholder="Nombre"><input id="re" placeholder="Email"><input id="rp" type="password" placeholder="Contraseña (6+)"><select id="rr"><option value="pasajero">Pasajero</option><option value="conductor">Conductor</option></select><button onclick="register()">Registrarme</button></div><div><h2>Entrar</h2><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Contraseña"><button onclick="login()">Entrar</button></div></div>`}async function register(){try{let d=await api("/api/auth/register",{method:"POST",body:JSON.stringify({name:rn.value,email:re.value,password:rp.value,role:rr.value})});token=d.token;localStorage.setItem("ra_token",token);await load()}catch(e){alert(e.message)}}async function login(){try{let d=await api("/api/auth/login",{method:"POST",body:JSON.stringify({email:le.value,password:lp.value})});token=d.token;localStorage.setItem("ra_token",token);await load()}catch(e){alert(e.message)}}function logout(){token="";user=null;localStorage.removeItem("ra_token");auth();render()}async function load(){try{user=await api("/api/me");auth();render()}catch(e){logout()}}const ORIGIN_COORDS={"Antigua":[28.418,-14.013],"Agua de Bueyes":[28.405,-14.003],"Caleta de Fuste":[28.398,-13.855],"Casillas de Morales":[28.358,-13.974],"Triquivijate":[28.39,-13.961],"Valles de Ortega":[28.397,-14.012],"Los Alares":[28.342,-13.981],"La Corte":[28.386,-14.045],"Las Pocetas":[28.43,-13.99],"Pozo Negro":[28.335,-13.901],"Salinas del Carmen":[28.405,-13.849],"Nuevo Horizonte":[28.395,-13.852],"Betancuria":[28.425,-14.057],"Valle de Santa Inés":[28.443,-14.031],"Vega de Río Palmas":[28.417,-14.063],"La Oliva":[28.611,-13.929],"Corralejo":[28.73,-13.868],"El Cotillo":[28.683,-14.006],"Lajares":[28.61,-13.939],"Villaverde":[28.63,-13.926],"Parque Holandés":[28.68,-13.941],"La Caldereta":[28.606,-13.951],"El Roque":[28.687,-14.007],"Tindaya":[28.579,-14.012],"Vallebrón":[28.61,-13.996],"Majanicho":[28.765,-14.022],"Pájara":[28.35,-14.106],"Morro Jable":[28.049,-14.354],"Cañada del Río":[28.132,-14.237],"Ajuy":[28.4,-14.158],"Los Albertos":[28.17,-14.243],"Bahía Calma":[28.167,-14.228],"El Cardón":[28.314,-14.078],"Costa Calma":[28.162,-14.227],"Esquinzo":[28.071,-14.3],"Mal Nombre":[28.108,-14.295],"La Lajita":[28.16,-14.163],"La Pared":[28.216,-14.22],"Piedras Caídas":[28.109,-14.332],"Punta de Jandía":[27.987,-14.5],"Solana del Matorral":[28.041,-14.351],"Toto":[28.356,-14.1],"Puerto de la Peña":[28.389,-14.153],"Mézquez":[28.29,-14.1],"Cofete":[28.105,-14.386],"El Puertito":[28.094,-14.331],"Puerto del Rosario":[28.5,-13.862],"La Ampuyenta":[28.508,-13.992],"La Asomada":[28.506,-13.911],"Casillas del Ángel":[28.526,-13.959],"Guisguey":[28.566,-13.925],"Llanos de la Concepción":[28.522,-14.003],"La Matilla":[28.558,-13.953],"El Matorral":[28.444,-13.869],"Puerto Lajas":[28.536,-13.859],"Tefía":[28.55,-13.933],"Tesjuate":[28.485,-13.919],"Tetir":[28.543,-13.89],"El Time":[28.563,-13.879],"Los Estancos":[28.535,-13.907],"Las Parcelas":[28.558,-13.889],"Puertito de los Molinos":[28.548,-14.015],"Tuineje":[28.323,-14.048],"Gran Tarajal":[28.213,-14.02],"Las Casitas":[28.265,-14.1],"Giniginámar":[28.21,-14.1],"Juan Gopar":[28.287,-14.031],"Las Playitas":[28.222,-13.99],"Tarajalejo":[28.194,-14.121],"Tequital":[28.25,-14.034],"Tesejerague":[28.286,-14.04],"Tiscamanita":[28.318,-14.025],"La Fuentita":[28.225,-14.067],"La Calabaza":[28.292,-14.06],"Marcos Sánchez":[28.23,-14.085],"Tamaretilla":[28.273,-14.021],"Rosa de los James":[28.25,-14.08],"Violante":[28.298,-14.06]};
function layoutHeader(){return `<div class="card"><h2>Hola, ${user.name} 👋</h2><p>Rol: <b>${user.role}</b> · 🪙 <b>${user.tokens}</b> tokens</p><button onclick="reward()">🎬 Simular vídeo +5</button></div>`}async function render(){if(!user){$("app").innerHTML="<div class='card'>Crea una cuenta o inicia sesión para comenzar.</div>";return}let h=layoutHeader();if(user.role==="conductor")h+=driverPanel();else h+=passengerPanel();$("app").innerHTML=h;if(user.role==="conductor"){await loadVehicles();await loadMyRoutes();initMap()}else await loadRoutes()}
function driverPanel(){return `<div class="card"><h2>🚗 Mi vehículo</h2><input id="brand" placeholder="Marca"><input id="model" placeholder="Modelo"><input id="plate" placeholder="Matrícula"><input id="seats" type="number" min="1" max="9" placeholder="Plazas"><button onclick="vehicle()">Guardar vehículo</button><div id="vs"></div><hr><h2>🛣️ Crear ruta</h2><p class="muted">Selecciona el pueblo desde el que sales.</p><select id="vehicleSelect"></select><select id="origin"><option value="">Selecciona el pueblo de origen</option><optgroup label="Antigua"><option>Antigua</option><option>Agua de Bueyes</option><option>Caleta de Fuste</option><option>Casillas de Morales</option><option>Triquivijate</option><option>Valles de Ortega</option><option>Los Alares</option><option>La Corte</option><option>Las Pocetas</option><option>Pozo Negro</option><option>Salinas del Carmen</option><option>Nuevo Horizonte</option></optgroup><optgroup label="Betancuria"><option>Betancuria</option><option>Valle de Santa Inés</option><option>Vega de Río Palmas</option></optgroup><optgroup label="La Oliva"><option>La Oliva</option><option>Corralejo</option><option>El Cotillo</option><option>Lajares</option><option>Villaverde</option><option>Parque Holandés</option><option>La Caldereta</option><option>El Roque</option><option>Tindaya</option><option>Vallebrón</option><option>Majanicho</option></optgroup><optgroup label="Pájara"><option>Pájara</option><option>Morro Jable</option><option>Cañada del Río</option><option>Ajuy</option><option>Los Albertos</option><option>Bahía Calma</option><option>El Cardón</option><option>Costa Calma</option><option>Esquinzo</option><option>Mal Nombre</option><option>La Lajita</option><option>La Pared</option><option>Piedras Caídas</option><option>Punta de Jandía</option><option>Solana del Matorral</option><option>Toto</option><option>Puerto de la Peña</option><option>Mézquez</option><option>Cofete</option><option>El Puertito</option></optgroup><optgroup label="Puerto del Rosario"><option>Puerto del Rosario</option><option>La Ampuyenta</option><option>La Asomada</option><option>Casillas del Ángel</option><option>Guisguey</option><option>Llanos de la Concepción</option><option>La Matilla</option><option>El Matorral</option><option>Puerto Lajas</option><option>Tefía</option><option>Tesjuate</option><option>Tetir</option><option>El Time</option><option>Los Estancos</option><option>Las Parcelas</option><option>Puertito de los Molinos</option></optgroup><optgroup label="Tuineje"><option>Tuineje</option><option>Gran Tarajal</option><option>Las Casitas</option><option>Giniginámar</option><option>Juan Gopar</option><option>Las Playitas</option><option>Tarajalejo</option><option>Tequital</option><option>Tesejerague</option><option>Tiscamanita</option><option>La Fuentita</option><option>La Calabaza</option><option>Marcos Sánchez</option><option>Tamaretilla</option><option>Rosa de los James</option><option>Violante</option></optgroup></select><input id="destination" value="Aeropuerto de Fuerteventura"><label>Fecha y hora<input id="time" type="datetime-local"></label><input id="available" type="number" min="1" placeholder="Plazas disponibles"><button onclick="route()">Crear ruta</button><hr><h2>📍 Puntos de recogida</h2><p class="muted">Selecciona una ruta y <b>haz doble clic directamente en el mapa</b> donde quieres recoger pasajeros.</p><select id="routeSelect" onchange="showRoutePoints(true)"></select><div id="map"></div><div id="selectedPoint" class="point">Haz doble clic en el mapa para colocar el siguiente punto.</div><div id="points"></div></div><div class="card"><h2>📋 Mis rutas y reservas</h2><div id="myRoutes">Cargando...</div></div>`}function passengerPanel(){return `<div class="card"><h2>🔎 Buscar rutas</h2><p class="muted">Elige una ruta, revisa sus puntos y reserva con 1 token.</p><div id="rs">Cargando...</div></div><div class="card"><h2>🎫 Mis reservas</h2><div id="myBookings">Cargando...</div></div>`}
async function loadVehicles(){let v=await api("/api/vehicles");$("vs").innerHTML=v.map(x=>`<div class="route-card"><b>${x.brand} ${x.model}</b> · ${x.plate} · ${x.seats} plazas <button class="danger" onclick="deleteVehicle('${x.id}')">Eliminar</button></div>`).join("")||"<p class='muted'>Sin vehículos.</p>";$("vehicleSelect").innerHTML=v.map(x=>`<option value="${x.id}">${x.brand} ${x.model} · ${x.plate}</option>`).join("")||"<option value=''>No hay vehículos</option>"}async function deleteVehicle(id){if(!confirm("¿Seguro que quieres eliminar este vehículo?"))return;try{await api("/api/vehicles/"+id,{method:"DELETE"});alert("Vehículo eliminado.");await loadVehicles()}catch(e){alert("No se puede eliminar: "+e.message)}}async function vehicle(){try{const b=brand.value.trim(),m=model.value.trim(),pl=plate.value.trim(),st=Number(seats.value);if(!b||!m||!pl||!Number.isInteger(st)||st<1||st>9)return alert("Completa correctamente los datos del vehículo.");await api("/api/vehicles",{method:"POST",body:JSON.stringify({brand:b,model:m,plate:pl,seats:st})});alert("Vehículo guardado correctamente.");await loadVehicles()}catch(e){alert("No se pudo guardar el vehículo: "+e.message)}}
async function route(){try{const vehicleId=vehicleSelect.value,originValue=origin.value.trim(),destinationValue=destination.value.trim(),timeValue=time.value,seatsValue=Number(available.value);if(!vehicleId)return alert("Primero debes guardar un vehículo.");if(!originValue)return alert("Escribe el origen de la ruta.");if(!destinationValue)return alert("Escribe el destino.");if(!timeValue)return alert("Selecciona fecha y hora.");if(!Number.isInteger(seatsValue)||seatsValue<1)return alert("Indica el número de plazas disponibles.");await api("/api/routes",{method:"POST",body:JSON.stringify({vehicleId,origin:originValue,destination:destinationValue,departureTime:timeValue,availableSeats:seatsValue})});alert("Ruta creada correctamente. Ahora puedes añadir puntos de recogida.");await loadMyRoutes();centerMapOnOrigin(originValue)}catch(e){alert("No se pudo crear la ruta: "+e.message)}}
async function loadMyRoutes(){let rs=await api("/api/my-routes");const current=$("routeSelect")?.value;$("routeSelect").innerHTML=rs.map(r=>`<option value="${r.id}">${r.origin} → ${r.destination} · ${new Date(r.departureTime).toLocaleString()}</option>`).join("");if(current&&rs.some(r=>r.id===current))$("routeSelect").value=current;showRoutePoints(false);$("myRoutes").innerHTML=rs.map(r=>`<div class="route-card"><b>${r.origin} → ${r.destination}</b><br>${new Date(r.departureTime).toLocaleString()} · ${r.availableSeats} plazas libres<div>${r.pickupPoints.map(p=>`<div class="point">📍 ${p.stopOrder}. ${p.name}</div>`).join("")||"<span class='muted'>Sin puntos todavía.</span>"}</div>${r.bookings.length?`<hr><b>Reservas</b>${r.bookings.map(b=>`<div class="point">${b.passengerName} · ${b.pickupPoint} · <span class="status ${b.status==='pending'?'pending':b.status}">${b.status}</span>${b.status==='pending'?`<br><button onclick="bookingStatus('${b.id}','accepted')">Aceptar</button><button class="danger" onclick="bookingStatus('${b.id}','rejected')">Rechazar</button>`:""}</div>`).join("")}`:""}<hr><button class="danger" onclick="deleteRoute('${r.id}')">🗑️ Eliminar ruta</button></div>`).join("")||"<p class='muted'>No has creado rutas.</p>"}
function centerMapOnOrigin(originName){const c=ORIGIN_COORDS[originName];if(!c||!map)return;map.setView(c,14,{animate:true});const originPin=L.circleMarker(c,{radius:8}).addTo(map);originPin.bindPopup("<b>📍 "+originName+"</b><br>Origen de la ruta").openPopup();setTimeout(()=>{if(map.hasLayer(originPin))map.removeLayer(originPin)},3500);$("selectedPoint").textContent="📍 Mapa centrado en "+originName+". Haz doble clic para añadir el primer punto de recogida."}
function initMap(){if(map)map.remove();map=L.map("map").setView([28.452,-13.86],11);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);map.doubleClickZoom.disable();map.on("dblclick",async e=>{const rid=$("routeSelect")?.value;if(!rid)return alert("Primero selecciona una ruta.");try{const ps=await api("/api/routes/"+rid+"/pickup-points");const next=ps.length+1;await api("/api/routes/"+rid+"/pickup-points",{method:"POST",body:JSON.stringify({name:"Punto "+next,latitude:e.latlng.lat,longitude:e.latlng.lng,stopOrder:next})});$("selectedPoint").textContent="📍 Punto "+next+" añadido. Puedes seguir haciendo doble clic para añadir más.";await loadMyRoutes()}catch(err){alert("No se pudo guardar el punto: "+err.message)}})}
async function showRoutePoints(center=false){if(!map)return;const rid=$("routeSelect").value;if(!rid){$("points").innerHTML="";return}const selectedText=$("routeSelect")?.selectedOptions?.[0]?.textContent||"";const originName=selectedText.split(" → ")[0].trim();if(center&&originName&&ORIGIN_COORDS[originName])map.setView(ORIGIN_COORDS[originName],14,{animate:true});const view=map.getCenter(),zoom=map.getZoom();map.eachLayer(layer=>{if(layer instanceof L.Marker)map.removeLayer(layer)});let ps=await api("/api/routes/"+rid+"/pickup-points");$("points").innerHTML=ps.map(p=>`<div class="point">📍 <b>Punto ${p.stopOrder}</b> <button class="danger" onclick="deletePoint('${rid}','${p.id}')">Eliminar</button></div>`).join("")||"<p class='muted'>Todavía no hay puntos. Haz doble clic en el mapa.</p>";ps.forEach(p=>{if(p.latitude!=null&&p.longitude!=null){const m=L.marker([p.latitude,p.longitude]).addTo(map);m.bindPopup(`<b>📍 Punto ${p.stopOrder}</b><br><button onclick="deletePoint('${rid}','${p.id}')">Eliminar</button>`)}});if(!center)map.setView(view,zoom,{animate:false})}
async function deletePoint(routeId,pointId){if(!confirm("¿Eliminar este punto de recogida?"))return;try{const view=map?map.getCenter():null,zoom=map?map.getZoom():null;await api("/api/routes/"+routeId+"/pickup-points/"+pointId,{method:"DELETE"});await loadMyRoutes();if(map&&view&&zoom!=null)map.setView(view,zoom,{animate:false})}catch(e){alert("No se pudo eliminar: "+e.message)}}
async function loadRoutes(){let r=await api("/api/routes");$("rs").innerHTML=r.map(x=>`<div class="route-card"><b>${x.origin} → ${x.destination}</b><br>${new Date(x.departureTime).toLocaleString()}<br>🚗 ${x.brand} ${x.model} · Conductor: ${x.driverName}<br>🪑 ${x.availableSeats} plazas<div id="p-${x.id}">Cargando puntos...</div></div>`).join("")||"<p class='muted'>No hay rutas disponibles.</p>";for(const x of r){const ps=await api("/api/routes/"+x.id+"/pickup-points"),el=$("p-"+x.id);el.innerHTML=ps.length?`<p><b>Puntos:</b></p>${ps.map(p=>`<label class="point"><input type="radio" name="pickup-${x.id}" value="${p.id}"> 📍 ${p.name}</label>`).join("")}<button onclick="book('${x.id}')">Reservar por 1 token</button>`:"<p class='muted'>El conductor aún no ha añadido puntos de recogida.</p>"}await loadMyBookings()}async function book(routeId){const selected=document.querySelector(`input[name="pickup-${routeId}"]:checked`);if(!selected)return alert("Selecciona un punto de recogida.");if(!confirm("La reserva consumirá 1 token. ¿Continuar?"))return;try{await api("/api/bookings",{method:"POST",body:JSON.stringify({routeId,pickupPointId:selected.value})});user=await api("/api/me");alert("Reserva enviada al conductor.");await render()}catch(e){alert(e.message)}}async function loadMyBookings(){const bs=await api("/api/my-bookings");$("myBookings").innerHTML=bs.map(b=>`<div class="route-card"><b>${b.route?.origin||""} → ${b.route?.destination||""}</b><br>${b.route?new Date(b.route.departureTime).toLocaleString():""}<br>📍 ${b.pickupPoint} · Conductor: ${b.driverName}<br>Estado: <span class="status ${b.status==='pending'?'pending':b.status}">${b.status}</span></div>`).join("")||"<p class='muted'>No tienes reservas.</p>"}async function deleteRoute(routeId){if(!confirm("¿Seguro que quieres eliminar esta ruta? Esta acción también eliminará sus puntos de recogida."))return;try{await api("/api/routes/"+routeId,{method:"DELETE"});alert("Ruta eliminada correctamente.");await loadMyRoutes();await loadVehicles()}catch(e){alert("No se puede eliminar la ruta: "+e.message)}}async function bookingStatus(id,status){try{await api("/api/bookings/"+id,{method:"PATCH",body:JSON.stringify({status})});await loadMyRoutes()}catch(e){alert(e.message)}}async function reward(){try{user=await api("/api/tokens/reward");render()}catch(e){alert(e.message)}}auth();if(token)load();else render();</script></body></html>
