<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RutaAero</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font-family:system-ui,sans-serif;background:#f4f7fb;color:#172033;margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 8px 28px #0001}input,select{width:100%;padding:11px;margin:5px 0 12px;border:1px solid #ccd5e3;border-radius:10px;box-sizing:border-box}button{border:0;border-radius:10px;padding:11px 14px;background:#1877f2;color:#fff;font-weight:700;cursor:pointer;margin:4px}.danger{background:#ffe8e8;color:#b42318}.muted{color:#667085}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:650px){.grid{grid-template-columns:1fr}}#map{height:380px;border-radius:14px;margin:12px 0}.route-card,.point{border:1px solid #dde4ee;border-radius:12px;padding:12px;margin:8px 0}.eta{font-weight:800}.status{font-weight:800}.pending{color:#b54708}.accepted{color:#18864b}.rejected{color:#b42318}.private{background:#eef6ff;border:1px solid #cfe4ff;border-radius:10px;padding:10px;margin:8px 0}</style></head><body><div class="wrap"><h1>🚗 RutaAero</h1><div id="auth"></div><div id="app"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
let token=localStorage.getItem('ra_token')||'',user=null,map=null,privateLocation=null;const $=id=>document.getElementById(id);const ORIGIN_COORDS={"Antigua":[28.418,-14.013],"Agua de Bueyes":[28.405,-14.003],"Caleta de Fuste":[28.398,-13.855],"Casillas de Morales":[28.358,-13.974],"Triquivijate":[28.39,-13.961],"Valles de Ortega":[28.397,-14.012],"Los Alares":[28.342,-13.981],"La Corte":[28.386,-14.045],"Las Pocetas":[28.43,-13.99],"Pozo Negro":[28.335,-13.901],"Salinas del Carmen":[28.405,-13.849],"Nuevo Horizonte":[28.395,-13.852],"Betancuria":[28.425,-14.057],"Valle de Santa Inés":[28.443,-14.031],"Vega de Río Palmas":[28.417,-14.063],"La Oliva":[28.611,-13.929],"Corralejo":[28.73,-13.868],"El Cotillo":[28.683,-14.006],"Lajares":[28.61,-13.939],"Villaverde":[28.63,-13.926],"Parque Holandés":[28.68,-13.941],"La Caldereta":[28.606,-13.951],"El Roque":[28.687,-14.007],"Tindaya":[28.579,-14.012],"Vallebrón":[28.61,-13.996],"Majanicho":[28.765,-14.022],"Pájara":[28.35,-14.106],"Morro Jable":[28.049,-14.354],"Cañada del Río":[28.132,-14.237],"Ajuy":[28.4,-14.158],"Los Albertos":[28.17,-14.243],"Bahía Calma":[28.167,-14.228],"El Cardón":[28.314,-14.078],"Costa Calma":[28.162,-14.227],"Esquinzo":[28.071,-14.3],"Mal Nombre":[28.108,-14.295],"La Lajita":[28.16,-14.163],"La Pared":[28.216,-14.22],"Piedras Caídas":[28.109,-14.332],"Punta de Jandía":[27.987,-14.5],"Solana del Matorral":[28.041,-14.351],"Toto":[28.356,-14.1],"Puerto de la Peña":[28.389,-14.153],"Mézquez":[28.29,-14.1],"Cofete":[28.105,-14.386],"El Puertito":[28.094,-14.331],"Puerto del Rosario":[28.5,-13.862],"La Ampuyenta":[28.508,-13.992],"La Asomada":[28.506,-13.911],"Casillas del Ángel":[28.526,-13.959],"Guisguey":[28.566,-13.925],"Llanos de la Concepción":[28.522,-14.003],"La Matilla":[28.558,-13.953],"El Matorral":[28.444,-13.869],"Puerto Lajas":[28.536,-13.859],"Tefía":[28.55,-13.933],"Tesjuate":[28.485,-13.919],"Tetir":[28.543,-13.89],"El Time":[28.563,-13.879],"Los Estancos":[28.535,-13.907],"Las Parcelas":[28.558,-13.889],"Puertito de los Molinos":[28.548,-14.015],"Tuineje":[28.323,-14.048],"Gran Tarajal":[28.213,-14.02],"Las Casitas":[28.265,-14.1],"Giniginámar":[28.21,-14.1],"Juan Gopar":[28.287,-14.031],"Las Playitas":[28.222,-13.99],"Tarajalejo":[28.194,-14.121],"Tequital":[28.25,-14.034],"Tesejerague":[28.286,-14.04],"Tiscamanita":[28.318,-14.025],"La Fuentita":[28.225,-14.067],"La Calabaza":[28.292,-14.06],"Marcos Sánchez":[28.23,-14.085],"Tamaretilla":[28.273,-14.021],"Rosa de los James":[28.25,-14.08],"Violante":[28.298,-14.06]};
async function api(u,o={}){o.headers={...(o.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d}function auth(){if(token)$("auth").innerHTML='<div class="card"><b>Sesión iniciada</b><button class="danger" onclick="logout()">Cerrar sesión</button></div>';else $("auth").innerHTML='<div class="card grid"><div><h2>Crear cuenta</h2><input id="rn" placeholder="Nombre"><input id="re" placeholder="Email"><input id="rp" type="password" placeholder="Contraseña (6+)"><select id="rr"><option value="pasajero">Pasajero</option><option value="conductor">Conductor</option></select><button onclick="register()">Registrarme</button></div><div><h2>Entrar</h2><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Contraseña"><button onclick="login()">Entrar</button></div></div>')}async function register(){try{const d=await api('/api/auth/register',{method:'POST',body:JSON.stringify({name:rn.value,email:re.value,password:rp.value,role:rr.value})});token=d.token;localStorage.setItem('ra_token',token);await load()}catch(e){alert(e.message)}}async function login(){try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:le.value,password:lp.value})});token=d.token;localStorage.setItem('ra_token',token);await load()}catch(e){alert(e.message)}}function logout(){token='';user=null;localStorage.removeItem('ra_token');auth();render()}async function load(){try{user=await api('/api/me');const saved=localStorage.getItem('ra_private_'+user.id);privateLocation=saved?JSON.parse(saved):null;auth();await render()}catch(e){logout()}}function header(){return `<div class="card"><h2>Hola, ${user.name} 👋</h2><p>Rol: <b>${user.role}</b> · 🪙 <b>${user.tokens}</b> tokens</p><button onclick="reward()">🎬 Simular vídeo +5</button></div>`}async function render(){if(!user){$('app').innerHTML='<div class="card">Crea una cuenta o inicia sesión para comenzar.</div>';return}$('app').innerHTML=header()+(user.role==='conductor'?driverPanel():passengerPanel());if(user.role==='conductor'){await loadVehicles();await loadMyRoutes();initMap()}else await loadRoutes()}
function driverPanel(){const opts=Object.keys(ORIGIN_COORDS).map(x=>`<option value="${x}">${x}</option>`).join('');return `<div class="card"><h2>🚗 Mi vehículo</h2><input id="brand" placeholder="Marca"><input id="model" placeholder="Modelo"><input id="plate" placeholder="Matrícula"><input id="seats" type="number" min="1" max="9" placeholder="Plazas"><button onclick="vehicle()">Guardar vehículo</button><div id="vs"></div><hr><h2>🔐 Ubicación privada del conductor</h2><div class="private"><p class="muted">Solo se usa para calcular las horas aproximadas. <b>No se muestra al pasajero.</b></p><button onclick="savePrivateLocation()">📍 Usar mi ubicación privada</button><span id="privateStatus">${privateLocation?' ✅ Ubicación privada guardada':' ⚠️ No establecida'}</span></div><hr><h2>🛣️ Crear ruta</h2><select id="vehicleSelect"></select><select id="origin"><option value="">Selecciona el pueblo de origen</option>${opts}</select><input id="destination" value="Aeropuerto de Fuerteventura"><label>Fecha y hora de salida<input id="time" type="datetime-local"></label><input id="available" type="number" min="1" placeholder="Plazas disponibles"><button onclick="route()">Crear ruta</button><hr><h2>📍 Puntos de recogida</h2><p class="muted">Selecciona una ruta y haz <b>doble clic</b> en el mapa. El mapa mantendrá el zoom actual.</p><select id="routeSelect" onchange="showRoutePoints(true)"></select><div id="map"></div><div id="selectedPoint" class="point">Selecciona una ruta y haz doble clic para añadir un punto.</div><div id="points"></div></div><div class="card"><h2>📋 Mis rutas y reservas</h2><div id="myRoutes">Cargando...</div></div>`}function passengerPanel(){return `<div class="card"><h2>🔎 Buscar rutas</h2><div id="rs">Cargando...</div></div><div class="card"><h2>🎫 Mis reservas</h2><div id="myBookings">Cargando...</div></div>`}async function savePrivateLocation(){if(!navigator.geolocation)return alert('Tu navegador no permite geolocalización.');navigator.geolocation.getCurrentPosition(p=>{privateLocation={lat:p.coords.latitude,lng:p.coords.longitude};localStorage.setItem('ra_private_'+user.id,JSON.stringify(privateLocation));$('privateStatus').textContent=' ✅ Ubicación privada guardada';alert('Ubicación privada guardada. No se mostrará a los pasajeros.')},e=>alert('No se pudo obtener tu ubicación: '+e.message),{enableHighAccuracy:true,timeout:10000})}
async function loadVehicles(){const v=await api('/api/vehicles');$('vs').innerHTML=v.map(x=>`<div class="route-card"><b>${x.brand} ${x.model}</b> · ${x.plate} · ${x.seats} plazas <button class="danger" onclick="deleteVehicle('${x.id}')">Eliminar</button></div>`).join('')||'<p class="muted">Sin vehículos.</p>';$('vehicleSelect').innerHTML=v.map(x=>`<option value="${x.id}">${x.brand} ${x.model} · ${x.plate}</option>`).join('')||'<option value="">No hay vehículos</option>'}async function deleteVehicle(id){if(!confirm('¿Eliminar este vehículo?'))return;try{await api('/api/vehicles/'+id,{method:'DELETE'});await loadVehicles()}catch(e){alert(e.message)}}async function vehicle(){try{await api('/api/vehicles',{method:'POST',body:JSON.stringify({brand:brand.value.trim(),model:model.value.trim(),plate:plate.value.trim(),seats:Number(seats.value)})});await loadVehicles();alert('Vehículo guardado.')}catch(e){alert(e.message)}}
async function route(){try{if(!privateLocation)return alert('Primero guarda la ubicación privada del conductor.');const v=vehicleSelect.value,o=origin.value.trim(),d=destination.value.trim(),t=time.value,s=Number(available.value);if(!v||!o||!d||!t||!Number.isInteger(s)||s<1)return alert('Completa los datos de la ruta.');await api('/api/routes',{method:'POST',body:JSON.stringify({vehicleId:v,origin:o,destination:d,departureTime:t,availableSeats:s,privateStartLat:privateLocation.lat,privateStartLng:privateLocation.lng})});await loadMyRoutes();centerMapOnOrigin(o);alert('Ruta creada. Las horas se calcularán con la ubicación privada.')}catch(e){alert(e.message)}}
async function loadMyRoutes(){const rs=await api('/api/my-routes'),old=$('routeSelect')?.value;$('routeSelect').innerHTML=rs.map(r=>`<option value="${r.id}">${r.origin} → ${r.destination} · ${new Date(r.departureTime).toLocaleString()}</option>`).join('');if(old&&rs.some(r=>r.id===old))$('routeSelect').value=old;showRoutePoints(false);$('myRoutes').innerHTML=rs.map(r=>`<div class="route-card"><b>${r.origin} → ${r.destination}</b><br>Salida: ${new Date(r.departureTime).toLocaleString()} · ${r.availableSeats} plazas libres<div>${r.pickupPoints.map(p=>`<div class="point">📍 Punto ${p.stopOrder} · <span class="eta">${p.estimatedArrival?formatTime(p.estimatedArrival):'Hora pendiente'}</span></div>`).join('')||'<span class="muted">Sin puntos.</span>'}</div>${r.bookings.length?'<hr><b>Reservas</b>'+r.bookings.map(b=>`<div class="point">${b.passengerName} · ${b.pickupPoint} · ${b.estimatedArrival?formatTime(b.estimatedArrival):''} · <span class="status ${b.status}">${b.status}</span>${b.status==='pending'?`<br><button onclick="bookingStatus('${b.id}','accepted')">Aceptar</button><button class="danger" onclick="bookingStatus('${b.id}','rejected')">Rechazar</button>`:''}</div>`).join(''):''}<hr><button class="danger" onclick="deleteRoute('${r.id}')">🗑️ Eliminar ruta</button></div>`).join('')||'<p class="muted">No tienes rutas.</p>'}function formatTime(iso){return new Date(iso).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}function centerMapOnOrigin(name){const c=ORIGIN_COORDS[name];if(map&&c)map.setView(c,14,{animate:true})}
function initMap(){if(map)map.remove();map=L.map('map').setView([28.452,-13.86],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);map.doubleClickZoom.disable();map.on('dblclick',async e=>{const rid=$('routeSelect')?.value;if(!rid)return alert('Selecciona una ruta.');const before=map.getCenter(),zoom=map.getZoom();try{const ps=await api('/api/routes/'+rid+'/pickup-points'),n=ps.length+1;await api('/api/routes/'+rid+'/pickup-points',{method:'POST',body:JSON.stringify({name:'Punto '+n,latitude:e.latlng.lat,longitude:e.latlng.lng,stopOrder:n})});await loadMyRoutes();map.setView(before,zoom,{animate:false});$('selectedPoint').textContent='📍 Punto '+n+' añadido. Hora estimada calculada.'}catch(err){alert(err.message)}})}async function showRoutePoints(center=false){if(!map)return;const rid=$('routeSelect').value;if(!rid)return;const before=map.getCenter(),zoom=map.getZoom(),txt=$('routeSelect').selectedOptions[0]?.textContent||'',originName=txt.split(' → ')[0];if(center&&ORIGIN_COORDS[originName])map.setView(ORIGIN_COORDS[originName],14,{animate:true});map.eachLayer(l=>{if(l instanceof L.Marker)map.removeLayer(l)});const ps=await api('/api/routes/'+rid+'/pickup-points');$('points').innerHTML=ps.map(p=>`<div class="point">📍 <b>Punto ${p.stopOrder}</b> · <span class="eta">${p.estimatedArrival?formatTime(p.estimatedArrival):'Hora pendiente'}</span> <button class="danger" onclick="deletePoint('${rid}','${p.id}')">Eliminar</button></div>`).join('')||'<p class="muted">Todavía no hay puntos.</p>';ps.forEach(p=>{if(p.latitude!=null&&p.longitude!=null)L.marker([p.latitude,p.longitude]).addTo(map).bindPopup(`<b>Punto ${p.stopOrder}</b><br>${p.estimatedArrival?formatTime(p.estimatedArrival):'Hora pendiente'}`)});if(!center)map.setView(before,zoom,{animate:false})}async function deletePoint(rid,pid){if(!confirm('¿Eliminar este punto?'))return;const c=map.getCenter(),z=map.getZoom();try{await api('/api/routes/'+rid+'/pickup-points/'+pid,{method:'DELETE'});await loadMyRoutes();map.setView(c,z,{animate:false})}catch(e){alert(e.message)}}async function deleteRoute(id){if(!confirm('¿Eliminar esta ruta?'))return;try{await api('/api/routes/'+id,{method:'DELETE'});await loadMyRoutes();await loadVehicles()}catch(e){alert(e.message)}}
async function loadRoutes(){const rs=await api('/api/routes');$('rs').innerHTML=rs.map(r=>`<div class="route-card"><b>${r.origin} → ${r.destination}</b><br>Salida: ${new Date(r.departureTime).toLocaleString()}<br>🚗 ${r.brand} ${r.model} · ${r.driverName}<br>🪑 ${r.availableSeats} plazas<div id="p-${r.id}">Cargando puntos...</div></div>`).join('')||'<p class="muted">No hay rutas disponibles.</p>';for(const r of rs){const ps=await api('/api/routes/'+r.id+'/pickup-points'),el=$('p-'+r.id);el.innerHTML=ps.length?'<p><b>Puntos de recogida:</b></p>'+ps.map(p=>`<label class="point"><input type="radio" name="pickup-${r.id}" value="${p.id}"> 📍 Punto ${p.stopOrder} · <span class="eta">${p.estimatedArrival?formatTime(p.estimatedArrival):'Hora pendiente'}</span></label>`).join('')+`<button onclick="book('${r.id}')">Reservar por 1 token</button>`:'<p class="muted">Sin puntos todavía.</p>'}await loadMyBookings()}async function book(id){const x=document.querySelector(`input[name="pickup-${id}"]:checked`);if(!x)return alert('Selecciona un punto.');if(!confirm('La reserva consumirá 1 token. ¿Continuar?'))return;try{await api('/api/bookings',{method:'POST',body:JSON.stringify({routeId:id,pickupPointId:x.value})});user=await api('/api/me');await render();alert('Reserva enviada.')}catch(e){alert(e.message)}}async function loadMyBookings(){const bs=await api('/api/my-bookings');$('myBookings').innerHTML=bs.map(b=>`<div class="route-card"><b>${b.route?.origin||''} → ${b.route?.destination||''}</b><br>${b.route?new Date(b.route.departureTime).toLocaleString():''}<br>📍 ${b.pickupPoint} · Hora: <span class="eta">${b.estimatedArrival?formatTime(b.estimatedArrival):'Pendiente'}</span><br>Conductor: ${b.driverName}<br>Estado: <span class="status ${b.status}">${b.status}</span></div>`).join('')||'<p class="muted">No tienes reservas.</p>'}async function bookingStatus(id,status){try{await api('/api/bookings/'+id,{method:'PATCH',body:JSON.stringify({status})});await loadMyRoutes()}catch(e){alert(e.message)}}async function reward(){try{user=await api('/api/tokens/reward');await render()}catch(e){alert(e.message)}}auth();if(token)load();else render();</script></body></html>
